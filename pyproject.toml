[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcrush"
version = "0.2.0"
description = "Speed up and shrink videos (screen recordings, lectures, timelapses) with ffmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "minicom365" }]
keywords = ["ffmpeg", "video", "compress", "screen-recording", "timelapse", "crf", "setpts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
vidcrush = "vidcrush.cli:main"

[project.urls]
Homepage = "https://github.com/minicom365/vidcrush"
Source = "https://github.com/minicom365/vidcrush"

[tool.setuptools]
packages = ["vidcrush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build odd argv lists and repeat literals for readability.
"tests/*" = ["E501"]
