name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `choco install ffmpeg` does not reliably land on PATH for the rest of
      # the job (the PATH edit only applies to newly started processes), so use
      # the dedicated action instead — it works on Linux, macOS and Windows.
      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show versions
        run: |
          ffmpeg -version
          python -c "import vidcrush; print('vidcrush', vidcrush.__version__)"

      - name: Run tests
        run: pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    name: smoke (installed entry point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install package
        run: python -m pip install .

      - name: Crush a generated clip through the real CLI
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=30:duration=4 \
            -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest sample.mp4
          vidcrush sample.mp4 -s 2 -o out.mp4 -y
          vidcrush out.mp4 --info
          python - <<'PY'
          from vidcrush.probe import probe
          info = probe("out.mp4")
          assert 1.5 < info.duration < 2.5, info.duration
          print("smoke ok:", round(info.duration, 2), "s", info.size, "bytes")
          PY
