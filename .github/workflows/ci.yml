name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show versions
        run: |
          ffmpeg -version
          python -c "import vidcrush; print(vidcrush.__version__)"

      - name: Run tests
        run: pytest -q

  smoke:
    name: smoke (installed entry point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - name: Crush a generated clip through the real CLI
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=30:duration=4 \
            -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest sample.mp4
          vidcrush sample.mp4 -s 2 -o out.mp4 -y
          vidcrush out.mp4 --info
          python - <<'PY'
          from vidcrush.probe import probe
          info = probe("out.mp4")
          assert 1.5 < info.duration < 2.5, info.duration
          print("ok:", info.duration, info.size)
          PY
